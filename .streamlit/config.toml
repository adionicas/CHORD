[server]
fileWatcherType = "none"
# the result files are also served from static/results, so "Download all" fetches them without redrawing the page
enableStaticServing = true

[client]
toolbarMode = "minimal"

[theme]
base                   = "light"
backgroundColor        = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor              = "#262730"
font                   = "sans serif"
